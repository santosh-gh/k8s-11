trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: k8s-common  
  - name: serviceName 
    value: 'config'
  - name: artifactName 
    value: 'storehelmchart'

stages:
  - stage: Publish
    displayName: Publish Manifest
    jobs:
      - job: PublishManifest
        displayName: Publish Manifest
        steps:          
          - task: PublishPipelineArtifact@1
            displayName: Publish Manifest
            inputs:
              targetPath: "$(Build.SourcesDirectory)/$(artifactName)"
              artifact: $(artifactName)